name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow==11.1.0
      - run: python -m py_compile server.py storage.py job_queue.py local_runtime.py ai_runner.py setup_ai.py instance_lock.py model_catalog.py
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/test_frontend.cjs
